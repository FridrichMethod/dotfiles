# Mouse support (scroll, select panes/windows, resize panes)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 100000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Native Mocha defaults also work without plugins.
set -g status-style 'bg=default,fg=#cdd6f4'
set -g status-interval 15
set -g status-left-length 60
set -g status-right-length 120
set -g status-justify centre
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'
setw -g window-status-style 'fg=#a6adc8,bg=default'
setw -g window-status-current-style 'fg=#cba6f7,bg=default,bold'
setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, ZOOM,} '

# Native OSC 52 reaches the local terminal over SSH, without a remote desktop
# clipboard. Keep native copy bindings when tmux-yank cannot use a clipboard.
set -g set-clipboard on
if-shell '! tmux show-options -sv terminal-overrides | grep -F "xterm*:Ms=" >/dev/null' 'set -as terminal-overrides ",xterm*:Ms=\\E]52;%p1%s;%p2%s\\007"'
if-shell '! tmux show-options -sv terminal-overrides | grep -F "xterm*:Tc" >/dev/null' 'set -as terminal-overrides ",xterm*:Tc"'
setw -g mode-keys vi
# Undo every default binding owned by tmux-yank before deciding whether this
# reload can use a desktop clipboard. Desktop TPM loading replaces them again.
unbind-key -T prefix y
unbind-key -T prefix Y
unbind-key -T copy-mode Y
unbind-key -T copy-mode M-y
unbind-key -T copy-mode !
unbind-key -T copy-mode-vi Y
unbind-key -T copy-mode-vi M-y
unbind-key -T copy-mode-vi !
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Plugins are provisioned by setup-host.sh (S3-clones), never at tmux startup.
# Keep TPM's plugin directory aligned with the bootstrap destination.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
# TPM statically scans @plugin lines, ignoring tmux conditionals. TPM's
# @tpm_plugins option gives the real battery/clipboard gates; reset it on reload.
set -g @tpm_plugins 'laktak/extrakto tmux-plugins/tmux-cpu'
# The battery plugin misidentifies battery-free Linux as WSL. Probe the device
# before loading it, so headless hosts never run its nonexistent-battery query.
if-shell 'command -v pmset >/dev/null 2>&1 || { { command -v acpi >/dev/null 2>&1 || command -v upower >/dev/null 2>&1; } && for supply in /sys/class/power_supply/*/type; do [ -r "$supply" ] || continue; read -r kind < "$supply"; [ "$kind" = Battery ] && exit 0; done; exit 1; }' 'set -ag @tpm_plugins " tmux-plugins/tmux-battery"'
if-shell '[ -z "$SSH_CONNECTION$SSH_CLIENT$SSH_TTY" ] && { command -v pbcopy >/dev/null 2>&1 || command -v clip.exe >/dev/null 2>&1 || { [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; } || { [ -n "$DISPLAY" ] && { command -v xsel >/dev/null 2>&1 || command -v xclip >/dev/null 2>&1; }; }; }' 'set -ag @tpm_plugins " tmux-plugins/tmux-yank"'
set -ag @tpm_plugins ' alexwforsythe/tmux-which-key'
source-file ~/.config/tmux/modern.conf
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
# Continuum must be last: it adds the automatic-save hook to status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore layouts and directories, without restarting programs or capturing
# terminal history. Hostname isolation keeps shared-home nodes independent.
# Expand tmux's hostname format now: show-options escapes literal dollar signs.
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -gF @resurrect-dir '~/.local/share/tmux/resurrect/#{host}'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g status on

# Prefix + F searches tmux objects in an fzf popup.
set-environment -g TMUX_FZF_ORDER 'session|window|pane'

# Tab extracts visible/recent text with fzf in a popup.
set -g @extrakto_grab_area 'window 2000'
set -g @extrakto_popup_size '80%,60%'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_fzf_unset_default_opts 'true'
set -g @extrakto_clip_mode 'bg'
if-shell '[ -n "$SSH_CONNECTION$SSH_CLIENT$SSH_TTY" ]' 'set -g @extrakto_clip_mode tmux_osc52'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @cpu_percentage_format '%3.0f%%'

# Use a checked-in native menu, with no Python/PyYAML generation or installs.
set -g @tmux-which-key-disable-autobuild 1

# Continuum runs last inside TPM, after every status writer.
run-shell 'if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'

# FloaX currently binds nonexistent top-level scripts; use its shipped scripts/.
# Alt-f leaves prefix+p (previous window) and prefix+F (fzf) intact.
if-shell '[ -x "$HOME/.tmux/plugins/tmux-floax/scripts/floax.sh" ]' 'source-file ~/.config/tmux/floax.conf'
source-file ~/.config/tmux/which-key.conf
set -g popup-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g popup-border-style 'fg=#cba6f7'
set -g popup-border-lines rounded
set -g menu-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g menu-selected-style 'bg=#cba6f7,fg=#1e1e2e,bold'
set -g menu-border-style 'fg=#cba6f7'
set -g menu-border-lines rounded
