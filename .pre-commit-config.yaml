# Pre-commit hooks for basic hygiene + shell scripts.
exclude: (^|/)(common/zsh/\.p10k\.zsh|common/zsh/\.local/bin/my-fzf-preview\.sh|sherlock/terminfo/\.terminfo/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Windows Terminal rewrites its settings.json on every UI save, with
      # its own trailing spaces and no final newline. Reformatting it here
      # only starts a fight the app always wins, so leave its bytes alone;
      # check-json below still validates it.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: (^|/)(\.p10k\.zsh|win/terminal/.*/settings\.json)$
      - id: end-of-file-fixer
        exclude: (^|/)win/terminal/.*/settings\.json$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^(tests/fixtures/chezmoi/native-config/modify_private_settings[.]json|home/dot_claude/modify_private_settings[.]json)$
      - id: check-toml
        exclude: ^(tests/fixtures/chezmoi/native-config/modify_private_config[.]toml|home/dot_codex/modify_private_config[.]toml)$
      - id: check-added-large-files
        args: [--maxkb=40000, --enforce-all]

  # gitleaks scans the staged changes, so it guards commits once
  # `pre-commit install` has run in the clone. gitleaks-history scans every
  # commit on every ref; CI runs it after a full-depth checkout
  # (`pre-commit run --hook-stage manual gitleaks-history`). Both read the
  # rules in .gitleaks.toml, which extends the defaults.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the Git history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: (\.sh$|(^|/)\.bash(rc|_profile|_aliases)$|(^|/)\.(profile|alias|aliases)$|/\.local/bin/[^/]+-sync$)
        types: [file]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, bash]
        files: (\.sh$|(^|/)\.bash(rc|_profile|_aliases)$)
        exclude: ^(scripts/(chezmoi-update|dotfiles-update|payload-update|awesome-skills-update)\.sh|setup-sync\.sh|lib/(chezmoi-guard|sync-runtime|terminal)\.sh)$
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, posix]
        files: ((^|/)\.(profile|alias|aliases)$|/\.local/bin/[^/]+-sync$|^(scripts/(chezmoi-update|dotfiles-update|payload-update|awesome-skills-update)\.sh|setup-sync\.sh|lib/(chezmoi-guard|sync-runtime|terminal)\.sh)$)
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, zsh]
        files: ((^|/)\.(zshrc|zshenv|zprofile|zsh_aliases)$|\.zsh$)
        # The upstream hook selects the shell type, which identify does not
        # give .zsh_aliases; every file the pattern names is checked instead.
        types: [file]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua
        files: \.(lua|luau)$

  - repo: local
    hooks:
      - id: english-documentation
        name: English documentation (ASCII only)
        language: pygrep
        entry: '[^\x09\x0a\x0d\x20-\x7e]'
        types: [file]
        files: '(?i)(\.(md|markdown|mdx|rst|txt)$|(^|/)(README|CHANGELOG|CONTRIBUTING|AUTHORS|LICENSE|NOTICE)(\.[^/]*)?$)'
      - id: test-entrypoints
        name: test entry points, fixture Git isolation and hook file patterns
        entry: tests/test-entrypoints.sh
        language: script
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|tests/[^/]+\.(sh|ps1)|tests/test_environment\.py|tests/lib/environment\.(sh|ps1))$
      - id: chezmoi-native
        name: isolated native chezmoi deployment, transforms and encryption
        entry: tests/chezmoi.sh
        language: script
        pass_filenames: false
        files: ^(home/.*|[.]chezmoi(root|version)|common/.*|(?:mac|wsl-ubuntu|lab-ubuntu|sherlock|marlowe|win)/.*|lib/(config_sync[.]py|sync-runtime[.]sh|chezmoi-guard[.](sh|ps1)|bootstrap/platform[.]sh)|(doctor|setup-host)[.]sh|scripts/(chezmoi-update|dotfiles-update|dotfiles-auto-stow|payload-update)[.](sh|ps1)|stow-all[.](sh|ps1)|docs/chezmoi-migration/inventory[.]md|tests/(chezmoi[^/]*[.]py|test_chezmoi[^/]*[.]py|chezmoi(-takeover)?[.](sh|ps1)|fixtures/chezmoi/.*|lib/environment[.](sh|ps1))|[.]github/scripts/install-test-chezmoi[.]py)$
      - id: terminal-output
        name: portable terminal output and color controls
        entry: tests/terminal.sh
        language: script
        pass_filenames: false
        files: ^(lib/terminal\.(sh|ps1)|tests/terminal\.(sh|ps1)|scripts/dotfiles-update\.sh|stow-all\.sh)$|^tests/lib/environment\.(sh|ps1)$
      - id: shell-profile
        name: portable shell profile and default manual search
        entry: tests/shell-profile.sh
        language: script
        pass_filenames: false
        files: ^(common/sh/\.(profile|aliases)|common/zsh/\.zshrc|common/zsh/\.oh-my-zsh/custom/(nvm|fzf-tab)\.zsh|lib/chezmoi-guard\.sh|tests/shell-profile\.sh)$|^tests/lib/environment\.(sh|ps1)$
      - id: tmux-config
        name: tmux plugin bootstrap and offline configuration
        entry: tests/tmux.sh
        language: script
        pass_filenames: false
        files: ^(common/tmux/.*|config/bootstrap/(git-clones|tools)\.tsv|tests/(tmux\.sh|test_tmux\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: structured-config-sync
        name: structured configuration merge and safe writes
        entry: tests/config-sync.sh
        language: script
        pass_filenames: false
        # test_config_sync.py also reads and asserts the real Codex config.toml.
        files: ^(lib/.*|requirements-sync\.txt|setup-sync\.(sh|ps1)|tests/(test_config_sync\.py|config-sync\.sh)|common/codex/\.codex/config\.toml|common/(claude|codex)/\.local/bin/.*)$|^tests/lib/environment\.(sh|ps1)$
        # identify tags a tracked link `symlink`; the default `types: [file]`
        # would skip a link change, so every hook whose files can name one
        # clears it.
        types: []
      - id: ai-config-sync
        name: ai config and rules sync
        entry: tests/ai-config-sync.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.(sh|ps1)|\.stowrc|common/(claude|codex)/.*|lib/(config_sync\.py|sync-runtime\.sh)|setup-sync\.(sh|ps1)|requirements-sync\.txt|tests/ai-config-sync\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: claude-customizations
        name: Claude status line, notifications and Git hook guard
        entry: node --test tests/claude-customizations.cjs
        language: system
        pass_filenames: false
        files: (^|/)(common/claude/.*|tests/claude-customizations\.cjs)$
        types: []
      - id: codex-config-sync
        name: codex config sync behavior
        entry: tests/codex-config-sync.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.(sh|ps1)|\.stowrc|lib/(config_sync\.py|sync-runtime\.sh)|common/codex/(\.codex/config\.toml|\.local/bin/codex-config-sync)|tests/codex-config-sync\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: ai-integration
        name: AI tooling integration with the real dotfiles content
        entry: tests/ai-integration.sh
        language: script
        pass_filenames: false
        files: ^(\.stowrc|common/(codex|claude)/.*|common/zsh/\.oh-my-zsh/custom/fzf-tab\.zsh|common/(zsh/\.zsh_aliases|bash/\.bash_aliases)|tests/(ai-integration\.sh|test_ai_integration\.py))$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: stow-installer
        name: POSIX stow installer behavior
        entry: tests/stow-all.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.sh|lib/terminal\.sh|lib/config_sync\.py|lib/sync-runtime\.sh|\.stowrc|tests/stow-all\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: stow-ignores
        name: Stow ignores what git ignores and links every tracked file
        entry: tests/stow-ignores.sh
        language: script
        pass_filenames: false
        files: ^(\.stowrc|\.gitignore|stow-all\.ps1|tests/(stow-ignores\.sh|test_stow_ignores\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: unix-installer-integration
        name: real Git and Stow integration
        entry: tests/unix-installer.sh
        language: script
        pass_filenames: false
        files: ^(stow-all\.sh|scripts/(dotfiles|payload|awesome-skills)-update\.sh|\.stowrc|\.gitignore|lib/.*|common/(claude|codex)/.*|tests/unix-installer\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: fcitx5-profile-sync
        name: fcitx5 profile sync behavior
        entry: tests/fcitx5-profile-sync.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.sh|\.stowrc|lab-ubuntu/fcitx5/.*|tests/fcitx5-profile-sync\.sh)$|^tests/lib/environment\.(sh|ps1)$
      - id: payload-update
        name: payload repo hook behavior
        entry: tests/payload-update.sh
        language: script
        pass_filenames: false
        files: ^(scripts/(payload-update\.(sh|ps1)|awesome-skills-update\.sh)|config/payloads\.tsv|lib/terminal\.(sh|ps1)|common/(sh/\.(profile|aliases)|zsh/\.zshrc)|tests/(payload-update\.(sh|ps1)|test_payload_download\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: windows-installer
        name: windows installer symlink trust
        entry: tests/windows-installer.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.ps1|setup-sync\.ps1|lib/config_sync\.py|lib/(terminal|windows-link-trust)\.ps1|tests/(terminal|windows-installer-controls)\.ps1|README\.md|CLAUDE\.md|AGENTS\.md|tests/windows-installer\.(sh|ps1)|tests/run\.ps1)$|^tests/lib/environment\.(sh|ps1)$
      - id: powershell-profile
        name: PowerShell profile contract and prompt theme
        entry: tests/powershell-profile.sh
        language: script
        pass_filenames: false
        files: ^(win/powershell/.*|win/oh-my-posh/.*|common/zsh/\.zshrc|lib/chezmoi-guard\.ps1|scripts/payload-update\.ps1|tests/powershell-profile\.(sh|ps1))$|^tests/lib/environment\.(sh|ps1)$
      - id: update-hooks
        name: automatic update and stow behavior
        entry: tests/update-hooks.sh
        language: script
        pass_filenames: false
        files: (^|/)(dotfiles-update\.(sh|ps1)|dotfiles-auto-stow\.ps1|stow-all\.(sh|ps1)|lib/terminal\.(sh|ps1)|win/powershell/Documents/PowerShell/profile\.ps1|tests/update-hooks\.(sh|ps1))$|^tests/lib/environment\.(sh|ps1)$
      - id: bootstrap-manifest
        name: bootstrap manifests, playbook and skill parity
        entry: tests/bootstrap-manifest.sh
        language: script
        pass_filenames: false
        files: ^(config/bootstrap/.*|lib/bootstrap/.*\.sh|lib/bootstrap\.ps1|tests/(bootstrap-manifest\.sh|test_bootstrap_manifest\.py)|docs/(bootstrap|dependencies)\.md|\.claude/skills/dotfiles-bootstrap/SKILL\.md|\.agents/skills/dotfiles-bootstrap/SKILL\.md|(doctor|setup-host)\.(sh|ps1)|README\.md|AGENTS\.md)$|^tests/lib/environment\.(sh|ps1)$
      - id: doctor
        name: read-only day-zero doctor
        entry: tests/doctor.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.sh|lib/bootstrap/.*|config/(bootstrap/.*|payloads\.tsv)|lib/(terminal|chezmoi-guard)\.sh|lib/config_sync\.py|lib/sync-runtime\.sh|docs/bootstrap\.md|tests/doctor\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: setup-host
        name: day-zero installer steps and HUMAN blocks
        entry: tests/setup-host.sh
        language: script
        pass_filenames: false
        files: ^(setup-host\.sh|lib/bootstrap/.*|config/(bootstrap/.*|payloads\.tsv)|lib/terminal\.sh|tests/setup-host\.sh|tests/fixtures/bootstrap/.*)$|^tests/lib/environment\.(sh|ps1)$
      - id: bootstrap-windows
        name: Windows doctor and installer twins
        entry: tests/bootstrap-windows.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.ps1|setup-host\.ps1|lib/(bootstrap|terminal|chezmoi-guard)\.ps1|config/(bootstrap/.*|payloads\.tsv)|tests/bootstrap(-windows\.sh|\.ps1))$|^tests/lib/environment\.(sh|ps1)$
      - id: host-overlays
        name: portable host shell profiles and optional tool guards
        entry: tests/host-overlays.sh
        language: script
        pass_filenames: false
        files: ^((mac|wsl-ubuntu|lab-ubuntu|sherlock|marlowe)/(sh/\.config/sh/\.profile|zsh/\.config/zsh/\.zshrc|bash/\.config/bash/\.bashrc)|common/sh/\.aliases|tests/(host-overlays\.sh|test_portable_shell\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: e2e-harness
        name: Unix end-to-end harness fixtures
        entry: tests/e2e-harness.sh
        language: script
        pass_filenames: false
        files: ^(tests/e2e(/|[-.]).*|docs/bootstrap\.md|setup-host\.sh|lib/bootstrap/.*)$|^tests/lib/environment\.(sh|ps1)$
      - id: e2e-harness-windows
        name: PowerShell end-to-end harness fixtures
        entry: tests/e2e-harness-windows.sh
        language: script
        pass_filenames: false
        files: ^(tests/e2e(/|[-.]).*|setup-host\.ps1|lib/bootstrap\.ps1)$|^tests/lib/environment\.(sh|ps1)$
