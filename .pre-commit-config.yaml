# Pre-commit hooks for basic hygiene + shell scripts.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Windows Terminal rewrites its settings.json on every UI save, with
      # its own trailing spaces and no final newline. Reformatting it here
      # only starts a fight the app always wins, so leave its bytes alone;
      # check-json below still validates it. The p10k configuration and
      # the fzf preview script keep their upstream bytes, so neither fixer
      # touches them either.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^home/(dot_p10k\.zsh|dot_local/bin/executable_my-fzf-preview\.sh|AppData/Local/Packages/Microsoft\.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings\.json)$
      - id: end-of-file-fixer
        exclude: ^home/(dot_p10k\.zsh|dot_local/bin/executable_my-fzf-preview\.sh|AppData/Local/Packages/Microsoft\.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings\.json)$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^(tests/fixtures/chezmoi/native-config/modify_private_settings[.]json|home/dot_claude/modify_private_settings[.]json)$
      - id: check-toml
        exclude: ^(tests/fixtures/chezmoi/native-config/modify_private_config[.]toml|home/dot_codex/modify_private_config[.]toml)$
      - id: check-added-large-files
        args: [--maxkb=40000, --enforce-all]

  # gitleaks scans the staged changes, so it guards commits once
  # `pre-commit install` has run in the clone. gitleaks-history scans every
  # commit on every ref; CI runs it after a full-depth checkout
  # (`pre-commit run --hook-stage manual gitleaks-history`). Both read the
  # rules in .gitleaks.toml, which extends the defaults.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the Git history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: (\.sh$|(^|/)(\.|dot_)bash(rc|_profile|_aliases)$|(^|/)(\.|dot_)(profile|alias|aliases)$)
        exclude: ^home/dot_local/bin/executable_my-fzf-preview\.sh$
        types: [file]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      # The upstream hook selects the shell type, which identify does not
      # give dot_ source names or .zsh_aliases; every variant checks each
      # file its pattern names instead.
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, bash]
        files: (\.sh$|(^|/)(\.|dot_)bash(rc|_profile|_aliases)$)
        exclude: ^(home/dot_local/bin/executable_my-fzf-preview\.sh|scripts/(chezmoi-update|payload-update)\.sh|lib/(chezmoi-guard|terminal)\.sh)$
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, posix]
        files: ((^|/)(\.|dot_)(profile|alias|aliases)$|^(scripts/(chezmoi-update|payload-update)\.sh|lib/(chezmoi-guard|terminal)\.sh)$)
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, zsh]
        files: ((^|/)(\.|dot_)(zshrc|zshenv|zprofile|zsh_aliases)$|\.zsh$)
        exclude: ^home/dot_p10k\.zsh$
        types: [file]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua
        files: \.(lua|luau)$

  - repo: local
    hooks:
      - id: english-documentation
        name: English documentation (ASCII only)
        language: pygrep
        entry: '[^\x09\x0a\x0d\x20-\x7e]'
        types: [file]
        files: '(?i)(\.(md|markdown|mdx|rst|txt)$|(^|/)(README|CHANGELOG|CONTRIBUTING|AUTHORS|LICENSE|NOTICE)(\.[^/]*)?$)'
      - id: test-entrypoints
        name: test entry points, fixture Git isolation and hook file patterns
        entry: tests/test-entrypoints.sh
        language: script
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|tests/[^/]+\.(sh|ps1)|tests/test_environment\.py|tests/lib/environment\.(sh|ps1)|tests/fixtures/chezmoi/targets\.tsv)$
      - id: repository-text
        name: retired mechanism names and Markdown links
        entry: tests/repository-text.sh
        language: script
        pass_filenames: false
        # Any tracked file can bring a retired name back and any deletion can
        # break a link, so this whole-repository scan runs on every commit.
        always_run: true
      - id: chezmoi-native
        name: isolated native chezmoi deployment, transforms and encryption
        entry: tests/chezmoi.sh
        language: script
        pass_filenames: false
        files: ^(home/.*|[.]chezmoi(root|version)|[.]gitattributes|lib/(chezmoi-guard[.](sh|ps1)|bootstrap/(platform|checks|steps-human)[.]sh)|(doctor|setup-host)[.]sh|scripts/(chezmoi-update|payload-update)[.](sh|ps1)|[.]gitignore|tests/(chezmoi[^/]*[.]py|test_chezmoi[^/]*[.]py|chezmoi(-takeover)?[.](sh|ps1)|fixtures/chezmoi/.*|lib/environment[.](sh|ps1))|[.]github/scripts/install-test-chezmoi[.]py)$
      - id: terminal-output
        name: portable terminal output and color controls
        entry: tests/terminal.sh
        language: script
        pass_filenames: false
        files: ^(lib/terminal\.(sh|ps1)|tests/terminal\.(sh|ps1)|(doctor|setup-host)\.ps1)$|^tests/lib/environment\.(sh|ps1)$
      - id: shell-profile
        name: portable shell profile and default manual search
        entry: tests/shell-profile.sh
        language: script
        pass_filenames: false
        files: ^(home/dot_(profile|aliases|zshrc)|home/dot_oh-my-zsh/custom/(nvm|fzf-tab)\.zsh|lib/chezmoi-guard\.sh|tests/shell-profile\.sh)$|^tests/lib/environment\.(sh|ps1)$
      - id: tmux-config
        name: tmux plugin bootstrap and offline configuration
        entry: tests/tmux.sh
        language: script
        pass_filenames: false
        files: ^(home/dot_tmux\.conf|home/dot_config/tmux/.*|config/bootstrap/(git-clones|tools)\.tsv|tests/(tmux\.sh|test_tmux\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: ai-policy
        name: portable AI policy, global guides and the CLAUDE.md stub
        entry: tests/ai-policy.sh
        language: script
        pass_filenames: false
        files: ^(home/\.policy/claude-settings\.json|home/dot_claude/CLAUDE\.md|home/dot_codex/(AGENTS\.md|rules/portable\.rules)|CLAUDE\.md|AGENTS\.md|tests/(ai-policy\.sh|test_ai_policy\.py))$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: claude-customizations
        name: Claude status line, notifications and Git hook guard
        entry: node --test tests/claude-customizations.cjs
        language: system
        pass_filenames: false
        files: ^(home/\.policy/claude-settings\.json|tests/claude-customizations\.cjs)$
        # identify tags a tracked link `symlink`; the default `types: [file]`
        # would skip a link change, so every hook whose files can name one
        # clears it.
        types: []
      - id: ai-integration
        name: AI tooling integration with the real dotfiles content
        entry: tests/ai-integration.sh
        language: script
        pass_filenames: false
        files: ^(\.claude/settings\.json|home/(\.policy/.*|dot_claude/.*|dot_codex/.*|dot_oh-my-zsh/custom/fzf-tab\.zsh|dot_zsh_aliases|dot_bash_aliases)|tests/(ai-integration\.sh|test_ai_integration\.py))$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: payload-update
        name: payload repo hook behavior
        entry: tests/payload-update.sh
        language: script
        pass_filenames: false
        files: ^(scripts/payload-update\.(sh|ps1)|config/payloads\.tsv|lib/(terminal\.(sh|ps1)|chezmoi-guard\.sh)|home/dot_(profile|aliases|zshrc)|tests/(payload-update\.(sh|ps1)|test_payload_download\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: powershell-profile
        name: PowerShell profile contract, prompt theme, parse gate and Terminal settings
        entry: tests/powershell-profile.sh
        language: script
        pass_filenames: false
        files: ^(home/Documents/(PowerShell|WindowsPowerShell)/.*|home/dot_config/oh-my-posh/.*|home/AppData/Local/Packages/Microsoft\.WindowsTerminal_8wekyb3d8bbwe/.*|home/dot_zshrc|(doctor|setup-host)\.ps1|lib/(chezmoi-guard|terminal)\.ps1|scripts/(chezmoi-update|payload-update)\.ps1|tests/(powershell-profile\.(sh|ps1)|run\.ps1|terminal\.ps1))$|^tests/lib/environment\.(sh|ps1)$
      - id: bootstrap-manifest
        name: bootstrap manifests, playbook and skill parity
        entry: tests/bootstrap-manifest.sh
        language: script
        pass_filenames: false
        files: ^(config/bootstrap/.*|lib/bootstrap/.*\.sh|lib/bootstrap\.ps1|tests/(bootstrap-manifest\.sh|test_bootstrap_manifest\.py)|docs/(bootstrap|dependencies)\.md|\.claude/skills/dotfiles-bootstrap/SKILL\.md|\.agents/skills/dotfiles-bootstrap/SKILL\.md|(doctor|setup-host)\.(sh|ps1)|README\.md|AGENTS\.md)$|^tests/lib/environment\.(sh|ps1)$
      - id: doctor
        name: read-only day-zero doctor
        entry: tests/doctor.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.sh|lib/bootstrap/.*|config/(bootstrap/.*|payloads\.tsv)|lib/(terminal|chezmoi-guard)\.sh|docs/bootstrap\.md|tests/doctor\.sh)$|^tests/lib/environment\.(sh|ps1)$
        types: []
      - id: setup-host
        name: day-zero installer steps and HUMAN blocks
        entry: tests/setup-host.sh
        language: script
        pass_filenames: false
        files: ^(setup-host\.sh|lib/bootstrap/.*|config/(bootstrap/.*|payloads\.tsv)|lib/(terminal|chezmoi-guard)\.sh|tests/setup-host\.sh|tests/fixtures/bootstrap/.*)$|^tests/lib/environment\.(sh|ps1)$
      - id: bootstrap-windows
        name: Windows doctor and installer twins
        entry: tests/bootstrap-windows.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.ps1|setup-host\.ps1|lib/(bootstrap|terminal|chezmoi-guard)\.ps1|config/(bootstrap/.*|payloads\.tsv)|tests/bootstrap(-windows\.sh|\.ps1))$|^tests/lib/environment\.(sh|ps1)$
      - id: host-overlays
        name: portable host shell profiles and optional tool guards
        entry: tests/host-overlays.sh
        language: script
        pass_filenames: false
        files: ^(home/\.hosts/(mac|wsl-ubuntu|lab-ubuntu|sherlock|marlowe)/\.config/(sh/\.profile|zsh/\.zshrc|bash/\.bashrc)|home/dot_aliases|tests/(host-overlays\.sh|test_portable_shell\.py))$|^tests/lib/environment\.(sh|ps1)$
      - id: e2e-harness
        name: Unix end-to-end harness fixtures
        entry: tests/e2e-harness.sh
        language: script
        pass_filenames: false
        files: ^(tests/e2e(/|[-.]).*|docs/bootstrap\.md|setup-host\.sh|lib/bootstrap/.*|config/bootstrap/installers\.tsv|\.chezmoiversion)$|^tests/lib/environment\.(sh|ps1)$
      - id: e2e-harness-windows
        name: PowerShell end-to-end harness fixtures
        entry: tests/e2e-harness-windows.sh
        language: script
        pass_filenames: false
        files: ^(tests/e2e(/|[-.]).*|docs/bootstrap\.md|setup-host\.ps1|lib/bootstrap\.ps1|lib/chezmoi-guard\.ps1)$|^tests/lib/environment\.(sh|ps1)$
