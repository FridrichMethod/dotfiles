# Pre-commit hooks for basic hygiene + shell scripts.
exclude: (^|/)(common/zsh/\.p10k\.zsh|common/zsh/\.local/bin/my-fzf-preview\.sh|sherlock/terminfo/\.terminfo/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Windows Terminal rewrites its settings.json on every UI save, with
      # its own trailing spaces and no final newline. Reformatting it here
      # only starts a fight the app always wins, so leave its bytes alone;
      # check-json below still validates it.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: (^|/)(\.p10k\.zsh|win/terminal/.*/settings\.json)$
      - id: end-of-file-fixer
        exclude: (^|/)win/terminal/.*/settings\.json$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=40000, --enforce-all]

  # gitleaks scans the staged changes, so it guards commits once
  # `pre-commit install` has run in the clone. gitleaks-history scans every
  # commit on every ref; CI runs it after a full-depth checkout
  # (`pre-commit run --hook-stage manual gitleaks-history`). Both read the
  # rules in .gitleaks.toml, which extends the defaults.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the Git history
        entry: gitleaks git --redact --verbose
        always_run: true
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: (\.sh$|(^|/)\.bash(rc|_profile|_aliases)$|(^|/)\.(profile|alias|aliases)$|/\.local/bin/[^/]+-sync$|/\.local/bin/(codex|claude)-as$|/bash-completion/completions/.*$)
        types: [file]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, bash]
        files: (\.sh$|(^|/)\.bash(rc|_profile|_aliases)$|/\.local/bin/codex-as$|/bash-completion/completions/.*$)
        exclude: ^(scripts/(dotfiles-update|awesome-skills-update)\.sh|setup-sync\.sh|lib/(sync-runtime|terminal)\.sh)$
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, posix]
        files: ((^|/)\.(profile|alias|aliases)$|/\.local/bin/([^/]+-sync|claude-as)$|^(scripts/(dotfiles-update|awesome-skills-update)\.sh|setup-sync\.sh|lib/(sync-runtime|terminal)\.sh)$)
        types: [file]
      - id: shfmt
        args: [-w, -i, "4", -ci, -ln, zsh]
        files: ((^|/)\.(zshrc|zshenv|zprofile|zsh_aliases)$|\.zsh$|/custom/completions/_[^/]+$)
        # The upstream hook selects the shell type, which identify does not
        # give .zsh_aliases; every file the pattern names is checked instead.
        types: [file]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua
        files: \.(lua|luau)$

  - repo: local
    hooks:
      - id: english-documentation
        name: English documentation (ASCII only)
        language: pygrep
        entry: '[^\x09\x0a\x0d\x20-\x7e]'
        types: [file]
        files: '(?i)(\.(md|markdown|mdx|rst|txt)$|(^|/)(README|CHANGELOG|CONTRIBUTING|AUTHORS|LICENSE|NOTICE)(\.[^/]*)?$)'
      - id: terminal-output
        name: portable terminal output and color controls
        entry: tests/terminal.sh
        language: script
        pass_filenames: false
        files: ^(lib/terminal\.(sh|ps1)|tests/terminal\.(sh|ps1)|scripts/dotfiles-update\.sh|stow-all\.sh)$
      - id: shell-profile
        name: portable shell profile and default manual search
        entry: tests/shell-profile.sh
        language: script
        pass_filenames: false
        files: ^(common/sh/\.profile|common/zsh/\.zshrc|common/zsh/\.oh-my-zsh/custom/(nvm|fzf-tab)\.zsh|tests/shell-profile\.sh)$
      - id: ai-config-sync
        name: ai config and rules sync
        entry: tests/ai-config-sync.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.(sh|ps1)|\.stowrc|common/(claude|codex)/.*|lib/sync-runtime\.sh|setup-sync\.(sh|ps1)|requirements-sync\.txt|tests/ai-config-sync\.sh)$
        # identify tags the coding-agent-kit gitlink `directory` and a link
        # `symlink`; the default `types: [file]` would skip a bump or a link
        # change, so every hook that runs the sync engine clears it.
        types: []
      - id: claude-customizations
        name: Claude status line, notifications and Git hook guard
        entry: node --test tests/claude-customizations.cjs
        language: system
        pass_filenames: false
        files: (^|/)(common/claude/.*|common/codex/coding-agent-kit|tests/claude-customizations\.cjs)$
        types: []
      - id: ai-integration
        name: AI tooling integration with the real dotfiles content
        entry: tests/ai-integration.sh
        language: script
        pass_filenames: false
        files: ^(\.stowrc|setup-sync\.(sh|ps1)|common/(codex|claude)/.*|common/zsh/\.oh-my-zsh/custom/fzf-tab\.zsh|common/(zsh/\.zsh_aliases|bash/\.bash_aliases)|lib/sync-runtime\.sh|tests/(ai-integration\.sh|test_ai_integration\.py))$
        types: []
      - id: stow-installer
        name: POSIX stow installer behavior
        entry: tests/stow-all.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.sh|lib/terminal\.sh|lib/config_sync\.py|lib/sync-runtime\.sh|common/codex/\.local/bin/codex-instructions-sync|\.stowrc|tests/stow-all\.sh)$
        types: []
      - id: sherlock-kit-delivery
        name: sherlock-kit submodule delivery and stow
        entry: tests/sherlock-kit-delivery.sh
        language: script
        pass_filenames: false
        files: ^(\.gitmodules|\.stowrc|stow-all\.(sh|ps1)|lib/(config_sync\.py|sync-runtime\.sh|terminal\.sh)|common/(claude|codex|sherlock-kit)/.*|[^/]+/sherlock-kit/.*|sherlock/sh/\.config/sh/\.profile|\.github/workflows/update-sherlock-kit-submodule\.yml|tests/sherlock-kit-delivery\.sh)$
        types: []
      - id: unix-installer-integration
        name: real Git and Stow integration
        entry: tests/unix-installer.sh
        language: script
        pass_filenames: false
        files: ^(stow-all\.sh|scripts/dotfiles-update\.sh|\.stowrc|lib/.*|common/(claude|codex)/.*|tests/unix-installer\.sh)$
        types: []
      - id: fcitx5-profile-sync
        name: fcitx5 profile sync behavior
        entry: tests/fcitx5-profile-sync.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.sh|\.stowrc|lab-ubuntu/fcitx5/.*|tests/fcitx5-profile-sync\.sh)$
      - id: awesome-skills-update
        name: awesome skills updater behavior
        entry: tests/awesome-skills-update.sh
        language: script
        pass_filenames: false
        files: (^|/)(awesome-skills-update\.sh|common/(sh/\.(profile|aliases)|zsh/\.zshrc)|tests/awesome-skills-update\.sh)$
      - id: windows-installer
        name: windows installer symlink trust
        entry: tests/windows-installer.sh
        language: script
        pass_filenames: false
        files: (^|/)(stow-all\.ps1|setup-sync\.ps1|lib/(terminal|windows-link-trust)\.ps1|tests/(terminal|windows-installer-controls)\.ps1|README\.md|CLAUDE\.md|AGENTS\.md|tests/windows-installer\.(sh|ps1)|tests/run\.ps1)$
      - id: powershell-profile
        name: PowerShell profile contract and prompt theme
        entry: tests/powershell-profile.sh
        language: script
        pass_filenames: false
        files: ^(win/powershell/.*|win/oh-my-posh/.*|common/zsh/\.zshrc|tests/powershell-profile\.(sh|ps1))$
      - id: update-hooks
        name: automatic update and stow behavior
        entry: tests/update-hooks.sh
        language: script
        pass_filenames: false
        files: (^|/)(dotfiles-update\.(sh|ps1)|dotfiles-auto-stow\.ps1|stow-all\.(sh|ps1)|lib/terminal\.(sh|ps1)|win/powershell/Documents/PowerShell/profile\.ps1|tests/update-hooks\.(sh|ps1))$
      - id: bootstrap-manifest
        name: bootstrap manifests, playbook and skill parity
        entry: tests/bootstrap-manifest.sh
        language: script
        pass_filenames: false
        files: ^(config/bootstrap/.*|lib/bootstrap/.*\.sh|lib/bootstrap\.ps1|tests/(bootstrap-manifest\.sh|test_bootstrap_manifest\.py)|docs/(bootstrap|dependencies)\.md|\.claude/skills/dotfiles-bootstrap/SKILL\.md|\.agents/skills/dotfiles-bootstrap/SKILL\.md|(doctor|setup-host)\.(sh|ps1)|README\.md|AGENTS\.md)$
      - id: doctor
        name: read-only day-zero doctor
        entry: tests/doctor.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.sh|lib/bootstrap/.*|config/bootstrap/.*|lib/terminal\.sh|lib/config_sync\.py|lib/sync-runtime\.sh|common/codex/\.local/bin/codex-instructions-sync|docs/bootstrap\.md|tests/doctor\.sh)$
        types: []
      - id: setup-host
        name: day-zero installer steps and HUMAN blocks
        entry: tests/setup-host.sh
        language: script
        pass_filenames: false
        files: ^(setup-host\.sh|lib/bootstrap/.*|config/bootstrap/.*|lib/terminal\.sh|tests/setup-host\.sh|tests/fixtures/bootstrap/.*)$
      - id: bootstrap-windows
        name: Windows doctor and installer twins
        entry: tests/bootstrap-windows.sh
        language: script
        pass_filenames: false
        files: ^(doctor\.ps1|setup-host\.ps1|lib/bootstrap\.ps1|lib/terminal\.ps1|config/bootstrap/.*|tests/bootstrap(-windows\.sh|\.ps1))$
      - id: host-overlays
        name: silent Linuxbrew guard in the Ubuntu overlays
        entry: tests/host-overlays.sh
        language: script
        pass_filenames: false
        files: ^((wsl|lab)-ubuntu/(zsh/\.config/zsh/\.zshrc|bash/\.config/bash/\.bashrc)|tests/host-overlays\.sh)$
