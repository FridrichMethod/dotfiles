model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"
default_permissions = "workspace-net"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
network_proxy = true
multi_agent = true
memories = true

[permissions.workspace-net]
description = "Workspace editing with unrestricted public network access."
extends = ":workspace"

[permissions.workspace-net.network]
enabled = true
allow_local_binding = false

[permissions.workspace-net.network.domains]
"*" = "allow"

[memories]
generate_memories = true
use_memories = true

[tui]
# Session token totals; estimated cost appears only for supported Enterprise workspaces.
status_line = [
    "model-with-reasoning",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
    "estimated-thread-cost",
    "current-dir",
    "thread-name",
    "git-branch",
    "context-used",
    "weekly-limit",
]
