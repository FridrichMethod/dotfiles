# Mouse support (scroll, select panes/windows, resize panes)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 100000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Plugins are provisioned by setup-host.sh (S3-clones), never at tmux startup.
# Keep TPM's plugin directory aligned with the bootstrap destination.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
# Continuum must be last: it adds the automatic-save hook to status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore layouts and directories, without restarting programs or capturing
# terminal history. Hostname isolation keeps shared-home nodes independent.
# Expand tmux's hostname format now: show-options escapes literal dollar signs.
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -gF @resurrect-dir '~/.local/share/tmux/resurrect/#{host}'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g status on

# Prefix + F searches tmux objects; fzf chooses popup or split by tmux version.
set-environment -g TMUX_FZF_ORDER 'session|window|pane'

# Keep initialization last. A host without TPM still gets native tmux.
run-shell 'if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'
