# Bespoke tmux-which-key manual config. Source after TPM on tmux >= 3.0.
# The upstream plugin's autobuild must be disabled before TPM is loaded.
# This deliberately stays in native tmux script; there is no YAML runtime.

set -g @wk_cfg_title_style 'align=centre,bold'
set -g @wk_cfg_title_prefix 'tmux'
set -g @wk_cfg_title_prefix_style 'fg=#cba6f7,align=centre,bold'
set -g @wk_cfg_pos_x R
set -g @wk_cfg_pos_y P

set -g @wk_menu_sessions \
'Choose "s" "choose-tree -Zs" \
New "n" new-session \
Last "l" "switch-client -l" \
"" \
"Save layout (C-s)" "S" "run-shell \"\\\"$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh\\\"\"" \
"Restore layout (C-r)" "R" "run-shell \"\\\"$HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh\\\"\"" \
"" \
Detach "d" detach-client'

set -g @wk_menu_windows \
'Choose "w" "choose-tree -Zw" \
"New here" "n" "new-window -c #{q:pane_current_path}" \
Previous "h" previous-window \
Next "l" next-window \
Last "tab" last-window \
"" \
"Next layout" "space" "next-layout ; show-wk-menu #{@wk_menu_windows}" \
Tiled "t" "select-layout tiled" \
"" \
Close "x" "confirm-before -p \"Close window #W? (y/n)\" kill-window"'

set -g @wk_menu_resize \
'Left "h" "resize-pane -L 5 ; show-wk-menu #{@wk_menu_resize}" \
Down "j" "resize-pane -D 5 ; show-wk-menu #{@wk_menu_resize}" \
Up "k" "resize-pane -U 5 ; show-wk-menu #{@wk_menu_resize}" \
Right "l" "resize-pane -R 5 ; show-wk-menu #{@wk_menu_resize}"'

set -g @wk_menu_panes \
'"Split side by side" "v" "split-window -h -c #{q:pane_current_path}" \
"Split top / bottom" "s" "split-window -v -c #{q:pane_current_path}" \
"" \
Left "h" "select-pane -L" \
Down "j" "select-pane -D" \
Up "k" "select-pane -U" \
Right "l" "select-pane -R" \
"Choose by number" "p" "display-panes -d 0" \
"" \
Zoom "z" "resize-pane -Z" \
"+Resize" "r" "show-wk-menu #{@wk_menu_resize}" \
"Break to window" "b" break-pane \
Close "x" "confirm-before -p \"Close pane #P? (y/n)\" kill-pane"'

set -g @wk_menu_plugins \
'"Install plugins (I)" "I" "run-shell \"\\\"$HOME/.tmux/plugins/tpm/bindings/install_plugins\\\"\"" \
"Update plugins (U)" "U" "run-shell \"\\\"$HOME/.tmux/plugins/tpm/bindings/update_plugins\\\"\"" \
"" \
"Reload config" "r" "source-file \"$HOME/.tmux.conf\"" \
"Show messages" "m" show-messages'

set -g @wk_menu_tools \
'"Fuzzy search (F)" "F" "run-shell -b \"TMUX_FZF_CLIENT=#{client_tty} \\\"$HOME/.tmux/plugins/tmux-fzf/main.sh\\\"\"" \
"Extract text (Tab)" "Tab" "run-shell \"\\\"$HOME/.tmux/plugins/extrakto/scripts/open.sh\\\" \\\"#{pane_id}\\\"\"" \
"#{?#{m:*omerxx/tmux-floax*,#{@tpm_plugins}},Floating shell (M-f),-Floating shell (tmux 3.3+)}" "f" "run-shell \"\\\"$HOME/.tmux/plugins/tmux-floax/scripts/floax.sh\\\"\"" \
"" \
"Copy mode" "c" copy-mode \
"Choose buffer" "b" "choose-buffer -Z" \
"Paste buffer" "p" paste-buffer \
"" \
"+Plugins / config" "P" "show-wk-menu #{@wk_menu_plugins}"'

set -g @wk_menu_root \
'"+Sessions" "s" "show-wk-menu #{@wk_menu_sessions}" \
"+Windows" "w" "show-wk-menu #{@wk_menu_windows}" \
"+Panes" "p" "show-wk-menu #{@wk_menu_panes}" \
"+Tools" "t" "show-wk-menu #{@wk_menu_tools}" \
"" \
"Fuzzy search (F)" "F" "run-shell -b \"TMUX_FZF_CLIENT=#{client_tty} \\\"$HOME/.tmux/plugins/tmux-fzf/main.sh\\\"\"" \
"Copy mode" "c" copy-mode \
Command ":" command-prompt \
"Key reference" "?" list-keys'

# Match upstream's two native command aliases. They must follow the options.
set -gF @wk_cmd_show "display-menu -x '#{@wk_cfg_pos_x}' -y '#{@wk_cfg_pos_y}' -T '#[#{@wk_cfg_title_style}]#[#{@wk_cfg_title_prefix_style}]#{@wk_cfg_title_prefix}#[#{@wk_cfg_title_style}]'"
set -gF command-alias[200] 'show-wk-menu=#{@wk_cmd_show}'
set -gF command-alias[201] 'show-wk-menu-root=#{@wk_cmd_show} #{@wk_menu_root}'

# Reparse after aliases exist; binding an alias freezes its body at bind time.
run-shell 'tmux bind-key -T prefix Space show-wk-menu-root'
