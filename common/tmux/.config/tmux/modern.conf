# Catppuccin, Nerd Font status and FloaX settings, sourced by ~/.tmux.conf.
set -ag @tpm_plugins ' catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
# Upstream rounded separators emit fg=none with a transparent status line.
# Draw each cap directly and reset the number style after the left cap.
# Set current separators explicitly too, so an existing server reloads cleanly.
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '#[fg=#{E:@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{E:@catppuccin_window_number_color}]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=#{E:@catppuccin_window_text_color},bg=default]#[default]'
set -g @catppuccin_window_current_left_separator '#[fg=#{E:@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{E:@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '#[fg=#{E:@catppuccin_window_current_text_color},bg=default]#[default]'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_pane_border_style 'fg=#45475a'
set -g @catppuccin_pane_active_border_style 'fg=#cba6f7'
set -g @catppuccin_menu_selected_style 'fg=#1e1e2e,bg=#cba6f7,bold'

# Nerd Font capsules match Kitty's Mocha palette and the p10k prompt.
set -g status-left '#[fg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=default]#[default]#{?client_prefix,#[fg=#f5c2e7] PREFIX,}#{?pane_in_mode,#[fg=#f9e2af] COPY,}#{?window_zoomed_flag,#[fg=#fab387] ZOOM,} '
# Forward upstream metrics with a private TMPDIR; its default /tmp cache is
# predictable and follows symlinks. Never expose its raw interpolation tokens.
set -g status-right '#[fg=#89b4fa]  #{b:pane_current_path} #[fg=#6c7086]|#[fg=#a6adc8] 󰒋 #h #[fg=#f9e2af]#{?#(python3 -I -B ~/.config/tmux/metric.py cpu 2>/dev/null),  #(python3 -I -B ~/.config/tmux/metric.py cpu 2>/dev/null),}#[fg=#a6e3a1]#{?#(python3 -I -B ~/.config/tmux/metric.py ram 2>/dev/null),  #(python3 -I -B ~/.config/tmux/metric.py ram 2>/dev/null),}#[fg=#b4befe]#{?#{battery_percentage}, 󰁹 #{battery_percentage},} '

# FloaX uses Alt-f, keeping normal previous-window on p.
set -g @floax-bind 'M-f'
set -g @floax-bind-menu 'M-F'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#cba6f7'
set -g @floax-text-color '#cdd6f4'
set -g @floax-change-path 'false'
set -ag @tpm_plugins ' omerxx/tmux-floax'
