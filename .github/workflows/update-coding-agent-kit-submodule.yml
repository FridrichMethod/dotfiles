name: update coding-agent-kit submodule

on:
  schedule:
    # Run daily at 05:17 UTC, after the PyMOLScripts (04:00)
    # bump and off the top of the hour, where GitHub delays
    # scheduled runs most. Delays still happen: a push that lands on main
    # first makes this run's push fail as non-fast-forward, nothing is
    # bumped, and the next run retries.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A dispatch during the scheduled run waits for it instead of racing it to
# main, and then finds the submodule up to date. The group is keyed on the
# ref: a run joins it before the job's condition is read, so a dispatch from
# another ref, whose job is skipped, cannot displace a pending main run.
concurrency:
  group: update-coding-agent-kit-submodule-${{ github.ref }}
  cancel-in-progress: false

# A bump changes code that runs in every Codex and Claude session on every
# host at its next login, so this run follows only the release line of the
# pin: the newest vMAJOR.MINOR.PATCH tag with the pinned MAJOR.MINOR. A new
# MINOR (breaking while the kit is 0.x), an untagged pin and anything that
# fails a gate go through a reviewed pull request instead.
jobs:
  bump:
    # A dispatch runs the workflow file of the ref it names, so the gates are
    # reviewed only on main: a run for any other ref skips the job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # bash -eo pipefail: any failed command fails its step and the run.
    defaults:
      run:
        shell: bash
    steps:
      # Gates 3 and 4 run the release's code, so the checkout keeps no
      # credential and no step that runs that code gets the token: gate 2
      # reads the check runs with it and both actions take it through their
      # default token input, all before the release is staged, and the push
      # gets it last. That keeps a release that misbehaves from pushing
      # here. A malicious one can still reach the push step and the actions'
      # post steps through the job's files ($GITHUB_PATH, $GITHUB_ENV) and
      # the checkout's .git: only a separate push job would stop that, and
      # such a release runs on every host at its next login anyway.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Find the pinned release and the newest release of its line
        id: pick
        run: |
          git submodule update --init -- common/coding-agent-kit/coding-agent-kit
          pinned_sha=$(git rev-parse HEAD:common/coding-agent-kit/coding-agent-kit)
          # Every tag, and the main that gate 1 checks the release against.
          git -C common/coding-agent-kit/coding-agent-kit fetch --quiet --tags origin +refs/heads/main:refs/remotes/origin/main
          # releases: the vMAJOR.MINOR.PATCH tag names on stdin, oldest first.
          releases() {
            { grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sort -V
          }
          pinned=$(git -C common/coding-agent-kit/coding-agent-kit tag --points-at "$pinned_sha" | releases | tail -n 1)
          if [ -z "$pinned" ]; then
            echo "::error::coding-agent-kit is pinned at $pinned_sha, which carries no vMAJOR.MINOR.PATCH release tag; bumps go through a reviewed pull request"
            echo "coding-agent-kit is pinned at the untagged commit $pinned_sha: until a release is pinned, bumps go through a reviewed pull request." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          candidate=$(git -C common/coding-agent-kit/coding-agent-kit tag --list "${pinned%.*}.*" | releases | tail -n 1)
          newest=$(git -C common/coding-agent-kit/coding-agent-kit tag --list | releases | tail -n 1)
          if [ "${newest%.*}" != "${pinned%.*}" ]; then
            echo "::notice::coding-agent-kit $newest is a newer release line than $pinned; bump to it through a reviewed pull request"
            echo "coding-agent-kit $newest is a newer release line than $pinned: bump to it through a reviewed pull request, never this workflow." >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ "$candidate" = "$pinned" ]; then
            echo "coding-agent-kit is up to date at $pinned." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git -C common/coding-agent-kit/coding-agent-kit rev-parse "refs/tags/$candidate^{commit}")
          {
            echo "changed=1"
            echo "pinned=$pinned"
            echo "pinned_sha=$pinned_sha"
            echo "tag=$candidate"
            echo "sha=$sha"
          } >>"$GITHUB_OUTPUT"
      # Gate 1: the release is a commit of the kit's main that descends from
      # the pin, never a tag on a side branch or behind the pin.
      - name: Require the release on coding-agent-kit main, ahead of the pin
        if: steps.pick.outputs.changed == '1'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
          PINNED_SHA: ${{ steps.pick.outputs.pinned_sha }}
        run: |
          git -C common/coding-agent-kit/coding-agent-kit merge-base --is-ancestor "$SHA" refs/remotes/origin/main ||
            { echo "::error::coding-agent-kit $TAG ($SHA) is not on its main"; exit 1; }
          git -C common/coding-agent-kit/coding-agent-kit merge-base --is-ancestor "$PINNED_SHA" "$SHA" ||
            { echo "::error::coding-agent-kit $TAG ($SHA) does not descend from the pinned $PINNED_SHA"; exit 1; }
      # Gate 2: the check-run names are the job names of coding-agent-kit's
      # ci.yml. Each must have a GitHub Actions run on the release commit,
      # and every such run, of the pull_request and the push to main alike,
      # must have completed with success: a red or unfinished run is not
      # hidden by a green one of the same name.
      - name: Require green coding-agent-kit CI on the release commit
        if: steps.pick.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          missing=$(gh api "repos/FridrichMethod/coding-agent-kit/commits/$SHA/check-runs?per_page=100" \
            --jq '["Linux behavior and lint", "macOS system Bash behavior", "Windows native PowerShell behavior"] - ([.check_runs[] | select(.app.slug == "github-actions") | .name] - [.check_runs[] | select(.app.slug == "github-actions" and (.status != "completed" or .conclusion != "success")) | .name]) | join(", ")')
          [ -z "$missing" ] ||
            { echo "::error::coding-agent-kit CI is not green on $TAG ($SHA): $missing"; exit 1; }
      # Gate 4 needs Node for the release's helper suite. The action takes
      # the token, so it runs before the release is staged.
      - uses: actions/setup-node@v6
        if: steps.pick.outputs.changed == '1'
        with:
          node-version: "24"
          package-manager-cache: false
      # Staged, so gates 3 and 4 check the gitlink this run would commit.
      - name: Stage coding-agent-kit at the release
        if: steps.pick.outputs.changed == '1'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          git -C common/coding-agent-kit/coding-agent-kit checkout --quiet --detach "$SHA"
          git add common/coding-agent-kit/coding-agent-kit
      # The runner image has neither GNU Stow nor zsh; with them no case of
      # gates 3 and 4 skips. Both gates run on the pinned AI-sync runtime.
      - name: Install GNU Stow, zsh and the AI-sync runtime
        if: steps.pick.outputs.changed == '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends stow zsh
          ./setup-sync.sh
      # Gate 3: --real proves that every delivered link resolves into the
      # staged release with its mode, and that the release keeps the
      # delivery contract: no tracked symlink, nested submodule or
      # .gitmodules, and no CODING_AGENT_KIT_* name that the test entry
      # points do not unset. --ci then runs the real stow-all.sh into
      # temporary homes with the checkout full, emptied and restored, and
      # both launchers through the stowed home links.
      - name: Refuse a release that breaks the delivered links
        if: steps.pick.outputs.changed == '1'
        run: |
          bash tests/coding-agent-kit-delivery.sh --real
          bash tests/coding-agent-kit-delivery.sh --ci
      # Gate 4: codex-as through dotfiles' alias files in Bash and zsh, the
      # fzf-tab account preview and a real Stow of the completions, then the
      # release's Claude helper suite on the real settings.json.
      - name: Refuse a release that breaks the real settings overlay
        if: steps.pick.outputs.changed == '1'
        run: bash tests/ai-integration.sh
      # Pushes made with GITHUB_TOKEN do not trigger ci.yml (GitHub starts no
      # workflow run for them), so gates 1-4 are all the checking this bump
      # gets before every host pulls it at its next login. Of this job's own
      # git commands only this push gets the token, as its header;
      # actions/checkout used it for its fetch and did not persist it, and
      # setup-node takes it by default, both before the release is staged.
      # A push that landed on main since the checkout makes it fail as
      # non-fast-forward: nothing is bumped, and the next run retries. It
      # never rebases and retries, which would push a gitlink that gate 4
      # never ran against the new main's settings.json.
      # A main rewound since the checkout is not caught; the push undoes it.
      - name: Commit the bump and push it to main
        if: steps.pick.outputs.changed == '1'
        env:
          PINNED: ${{ steps.pick.outputs.pinned }}
          TAG: ${{ steps.pick.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$(git diff --cached --name-only)" = common/coding-agent-kit/coding-agent-kit ] ||
            { echo "::error::the gates left more than the gitlink staged"; exit 1; }
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): update coding-agent-kit submodule to $TAG"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push origin HEAD:main
          echo "Bumped coding-agent-kit from $PINNED to $TAG on main." >>"$GITHUB_STEP_SUMMARY"
