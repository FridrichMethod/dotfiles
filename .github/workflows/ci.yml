name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux behavior and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full depth, every branch and tag, for the gitleaks history scan.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Only this submodule: the tests expect PyMOLScripts and sherlock-kit
      # to be absent, as they are without a recursive checkout.
      - name: Check out the coding-agent-kit submodule only
        run: git submodule update --init -- common/codex/coding-agent-kit
      - name: Require the pinned coding-agent-kit commit on its main
        run: |
          git -C common/codex/coding-agent-kit fetch --quiet origin main
          git -C common/codex/coding-agent-kit merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Unix test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes stow
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.sh
      - name: Run behavior tests with required CI prerequisites
        run: /bin/bash ./tests/run.sh --ci
      # The same steps pre-commit/action@v3.0.1 runs, without its unmaintained
      # actions/cache@v4 pin (Node 20). Same cache path and key.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - name: Scan the full Git history for secrets
        run: pre-commit run --color=always --hook-stage manual gitleaks-history

  macos:
    name: macOS system Bash behavior
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - name: Check out the coding-agent-kit submodule only
        run: git submodule update --init -- common/codex/coding-agent-kit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Unix test dependencies
        run: brew install stow
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.sh
      - name: Run behavior tests with system Bash and BSD utilities
        run: /bin/bash ./tests/run.sh --ci

  windows:
    name: Windows native PowerShell behavior
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v6
      # A local core.symlinks, then a fresh checkout of these two packages
      # only, so their links into coding-agent-kit become real symlinks; the
      # other tracked links stay text files, as without it.
      - name: Re-check out the claude and codex packages with symlinks
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          git config core.symlinks true
          git checkout -- common/claude common/codex
      - name: Check out the coding-agent-kit submodule only
        run: git submodule update --init -- common/codex/coding-agent-kit
      - name: Require LF line endings in the submodule checkout
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $crlf = @(git -C common/codex/coding-agent-kit ls-files --eol | Select-String -SimpleMatch 'w/crlf')
          if ($crlf.Count) { throw "CRLF in coding-agent-kit: $($crlf -join '; ')" }
      - name: Require tracked symlinks into the submodule
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $link = Get-Item -LiteralPath common/claude/.claude/dotfiles/statusline.cjs -Force
          if ($link.LinkType -ne 'SymbolicLink') { throw "statusline.cjs is a $($link.GetType().Name), not a symlink" }
          if (-not (Test-Path -LiteralPath $link.FullName -PathType Leaf)) { throw 'statusline.cjs does not resolve' }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.ps1
      - name: Run required native PowerShell and Node suites
        run: ./tests/run.ps1 -CI
