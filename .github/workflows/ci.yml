name: ci

on:
  pull_request:
  # main, and ci/** branches: there a change runs on all three systems before
  # main is fast-forwarded to it, with no pull request.
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux behavior and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full depth, every branch and tag, for the gitleaks history scan.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The real coding-agent-kit release of the channel config/payloads.tsv
      # declares, installed by the payload hook's own command into a home of
      # its own, for the AI integration cases that need an installed kit
      # (DOTFILES_TEST_KIT_HOME; they skip without it). The network is fine in
      # this step, never in a test. A failed install fails the job.
      - name: Install the real coding-agent-kit
        run: |
          HOME="$RUNNER_TEMP/kit-home" sh scripts/payload-update.sh --now kit
          echo "DOTFILES_TEST_KIT_HOME=$RUNNER_TEMP/kit-home" >>"$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Unix test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes stow
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.sh
      - name: Run behavior tests with required CI prerequisites
        run: /bin/bash ./tests/run.sh --ci
      # The same steps pre-commit/action@v3.0.1 runs, without its unmaintained
      # actions/cache@v4 pin (Node 20). Same cache path and key.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
      - name: Scan the full Git history for secrets
        run: pre-commit run --color=always --hook-stage manual gitleaks-history

  macos:
    name: macOS system Bash behavior
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6
      # As in the Linux job.
      - name: Install the real coding-agent-kit
        run: |
          HOME="$RUNNER_TEMP/kit-home" sh scripts/payload-update.sh --now kit
          echo "DOTFILES_TEST_KIT_HOME=$RUNNER_TEMP/kit-home" >>"$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Unix test dependencies
        run: brew install stow
      # fzf-tab as the bootstrap clones it, for the real fzf-tab preview case
      # of tests/test_ai_integration.py (this runner has zsh; ubuntu-24.04 has none).
      - name: Check out fzf-tab for the real fzf-tab preview test
        run: |
          read -r url ref < <(awk -F '\t' '$1 == "fzf-tab" { print $3, $4 }' config/bootstrap/git-clones.tsv)
          git clone --quiet --depth 1 --branch "$ref" "$url" "$RUNNER_TEMP/fzf-tab"
          echo "FZF_TAB_TEST_DIR=$RUNNER_TEMP/fzf-tab" >> "$GITHUB_ENV"
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.sh
      - name: Run behavior tests with system Bash and BSD utilities
        run: /bin/bash ./tests/run.sh --ci

  windows:
    name: Windows native PowerShell behavior
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v6
      # As in the Linux job, through the PowerShell twin of the payload hook.
      # PowerShell's $HOME is the account's profile whatever USERPROFILE says,
      # so the kit goes into the runner's own profile, which no test writes.
      - name: Install the real coding-agent-kit
        run: |
          & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -File scripts/payload-update.ps1 -Now kit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DOTFILES_TEST_KIT_HOME=$HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Provision pinned configuration parser explicitly
        run: ./setup-sync.ps1
      - name: Run required native PowerShell and Node suites
        run: ./tests/run.ps1 -CI
